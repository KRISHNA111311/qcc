[tool.poetry]
name = "qcc"
version = "0.1.0"
description = "Quantum Circuit Composer - AI-powered education platform"
authors = ["Your Name <you@email.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "qcc", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
qiskit = "^2.5.2"
qiskit-aer = "^0.17.2"
pennylane = "^0.45.1"
cirq = "^1.7.0"
pytket = "^2.18.1"
amazon-braket-sdk = "^1.85.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
python-multipart = "^0.0.20"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
alembic = "^1.14.1"
httpx = "^0.28.1"
pydantic-settings = "^2.6.1"
python-dotenv = "^1.0.0"
loguru = "^0.7.3"
matplotlib = "^3.10.0"
numpy = "^2.2.0"
psycopg2-binary = "^2.9.12"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
black = "^26.5.1"
flake8 = "^7.3.0"
mypy = "^2.3.1"
isort = "^9.0.1"
pre-commit = "^4.6.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"