services:
  - type: web
    name: qcc-backend
    runtime: docker
    repo: https://github.com/yourusername/qcc  # replace with your repo
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qcc-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /api/health

databases:
  - name: qcc-db
    plan: free
