<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Q‑Sphere · Radial Lines & Active Only</title>
    <style>
        /* ── reset & base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e17;
            color: #e0e6f0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* ── header ── */
        .header {
            background: linear-gradient(135deg, #0f1629 0%, #1a1f35 100%);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #2a3050;
            flex-shrink: 0;
            z-index: 10;
            flex-wrap: wrap;
            gap: 6px 12px;
        }
        .header h1 {
            font-weight: 500;
            font-size: 17px;
            letter-spacing: 0.3px;
            background: linear-gradient(90deg, #6c8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 small {
            font-size: 12px;
            -webkit-text-fill-color: #6a7a9a;
            background: none;
            font-weight: 400;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header-controls label {
            font-size: 11px;
            color: #8892b0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header-controls input[type="number"] {
            width: 44px;
            background: #0f1422;
            border: 1px solid #2a3050;
            border-radius: 4px;
            padding: 2px 4px;
            color: #e0e6f0;
            font-size: 13px;
            text-align: center;
            font-weight: 600;
        }
        .header-controls input[type="number"]:focus {
            outline: none;
            border-color: #6c8cff;
        }
        .header-controls .badge {
            font-size: 10px;
            color: #8892b0;
            background: #1a2040;
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid #2a3050;
            white-space: nowrap;
        }
        .header-controls .btn {
            background: #161d36;
            border: 1px solid #2a3050;
            color: #b0bcdb;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .header-controls .btn:hover {
            background: #1e2650;
            border-color: #4a5a8a;
            color: #fff;
        }
        .header-controls .btn.active {
            border-color: #6c8cff;
            background: #1a2250;
            color: #fff;
        }

        /* ── main layout ── */
        .main {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* ── 3D viewport ── */
        .viewport {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at center, #111827 0%, #070a12 100%);
            overflow: hidden;
        }
        .viewport canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── phase legend overlay ── */
        .phase-legend {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 28, 0.80);
            backdrop-filter: blur(8px);
            border: 1px solid #1e264a;
            border-radius: 10px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            flex-wrap: wrap;
            justify-content: center;
        }
        .phase-legend .label {
            font-size: 10px;
            color: #6a7a9a;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            font-weight: 600;
        }
        .phase-legend .gradient-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .phase-legend .gradient {
            width: 120px;
            height: 8px;
            border-radius: 4px;
            background: conic-gradient(from 0deg,
                    #ff4466, #ff8844, #ffcc44, #66dd88,
                    #44aaff, #8866ff, #ff44aa, #ff4466);
            border: 1px solid #2a3050;
        }
        .phase-legend .ticks {
            display: flex;
            justify-content: space-between;
            width: 120px;
            font-size: 8px;
            color: #4a5a7a;
            font-family: 'JetBrains Mono', monospace;
            margin-top: 1px;
        }

        /* ── state overlay (top-left) ── */
        .state-overlay {
            position: absolute;
            top: 14px;
            left: 18px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.5;
        }
        .state-overlay .label {
            font-size: 9px;
            color: #6a7a9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .state-overlay .value {
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
            font-size: 13px;
            color: #e8eeff;
        }
        .state-overlay .value .highlight {
            color: #a78bfa;
        }
        .state-overlay .value .phase-highlight {
            color: #fbbf24;
        }
        .state-overlay .sub {
            font-size: 10px;
            color: #6a7a9a;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ── right panel ── */
        .panel {
            width: 280px;
            background: #0f1422;
            border-left: 1px solid #1e2640;
            padding: 14px 16px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .panel::-webkit-scrollbar {
            width: 3px;
        }
        .panel::-webkit-scrollbar-track {
            background: #0b0e17;
        }
        .panel::-webkit-scrollbar-thumb {
            background: #2a3050;
            border-radius: 4px;
        }

        .panel-section {
            border-bottom: 1px solid #1a2040;
            padding-bottom: 10px;
        }
        .panel-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .panel-section-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6a7a9a;
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* ── preset buttons ── */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .preset-btn {
            background: #161d36;
            border: 1px solid #1e264a;
            color: #b0bcdb;
            padding: 3px 0;
            border-radius: 3px;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
        }
        .preset-btn:hover {
            background: #1e2650;
            border-color: #4a5a8a;
            color: #fff;
        }
        .preset-btn.active {
            border-color: #6c8cff;
            background: #1a2250;
            color: #fff;
        }
        .preset-btn .sub {
            font-size: 7px;
            opacity: 0.4;
            display: block;
            margin-top: 1px;
            font-weight: 400;
        }

        /* ── probability bars ── */
        .prob-bars {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 2px;
        }
        .prob-bars::-webkit-scrollbar {
            width: 2px;
        }
        .prob-bars::-webkit-scrollbar-thumb {
            background: #2a3050;
            border-radius: 4px;
        }
        .prob-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
        }
        .prob-row .label {
            width: 36px;
            color: #8892b0;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            flex-shrink: 0;
            text-align: right;
        }
        .prob-row .track {
            flex: 1;
            height: 5px;
            background: #1a2040;
            border-radius: 2px;
            overflow: hidden;
        }
        .prob-row .fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.25s ease;
            width: 0%;
        }
        .prob-row .pval {
            width: 34px;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            color: #e8eeff;
            flex-shrink: 0;
        }

        /* ── state info grid ── */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 10px;
            font-size: 11px;
        }
        .info-grid .item {
            display: flex;
            justify-content: space-between;
            padding: 1px 0;
            border-bottom: 1px solid #141c30;
        }
        .info-grid .item .lbl {
            color: #6a7a9a;
            font-size: 10px;
        }
        .info-grid .item .val {
            color: #e8eeff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
        }

        /* ── qubit controls inline ── */
        .qubit-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        .qubit-controls button {
            background: #161d36;
            border: 1px solid #2a3050;
            color: #b0bcdb;
            width: 24px;
            height: 24px;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .qubit-controls button:hover {
            background: #1e2650;
            border-color: #4a5a8a;
            color: #fff;
        }
        .qubit-controls .qcount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            font-weight: 600;
            color: #e8eeff;
            min-width: 28px;
            text-align: center;
        }

        /* ── responsive ── */
        @media (max-width: 820px) {
            .panel {
                width: 220px;
                padding: 10px 12px;
            }
            .phase-legend .gradient {
                width: 90px;
            }
            .phase-legend .ticks {
                width: 90px;
            }
            .preset-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .header h1 {
                font-size: 14px;
            }
            .header h1 small {
                font-size: 10px;
            }
        }
        @media (max-width: 640px) {
            .main {
                flex-direction: column;
            }
            .panel {
                width: 100%;
                border-left: none;
                border-top: 1px solid #1e2640;
                max-height: 40vh;
                padding: 8px 12px;
            }
            .viewport {
                height: 60vh;
            }
            .phase-legend {
                bottom: 10px;
                padding: 4px 10px;
                gap: 6px;
                flex-wrap: wrap;
            }
            .phase-legend .gradient {
                width: 70px;
                height: 6px;
            }
            .phase-legend .ticks {
                width: 70px;
                font-size: 6px;
            }
            .state-overlay {
                top: 8px;
                left: 10px;
            }
            .state-overlay .value {
                font-size: 11px;
            }
            .header {
                padding: 4px 12px;
            }
            .header h1 {
                font-size: 12px;
            }
            .header-controls .badge {
                font-size: 8px;
                padding: 1px 6px;
            }
            .header-controls label {
                font-size: 9px;
            }
            .header-controls input[type="number"] {
                width: 34px;
                font-size: 11px;
            }
            .preset-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .prob-row .label {
                width: 28px;
                font-size: 8px;
            }
            .prob-row .pval {
                width: 28px;
                font-size: 8px;
            }
            .info-grid .item .lbl {
                font-size: 9px;
            }
            .info-grid .item .val {
                font-size: 9px;
            }
            .qubit-controls .qcount {
                font-size: 14px;
                min-width: 24px;
            }
            .qubit-controls button {
                width: 22px;
                height: 22px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ─── Header ─── -->
    <header class="header">
        <h1>
            ✦ Q‑Sphere
            <small>radial lines · active only</small>
        </h1>
        <div class="header-controls">
            <label>
                qubits
                <input type="number" id="qubitInput" value="3" min="1" max="6" step="1" />
            </label>
            <span class="badge" id="stateCountBadge">8 states</span>
            <button class="btn" id="rotateToggle" title="Toggle auto-rotation (Space)">⟳</button>
            <button class="btn" id="resetViewBtn" title="Reset camera view">⌖</button>
        </div>
    </header>

    <!-- ─── Main ─── -->
    <div class="main">
        <!-- 3D viewport -->
        <div class="viewport" id="viewport">
            <!-- Phase legend -->
            <div class="phase-legend">
                <span class="label">Phase</span>
                <div class="gradient-wrap">
                    <div class="gradient"></div>
                    <div class="ticks">
                        <span>0</span>
                        <span>π/2</span>
                        <span>π</span>
                        <span>3π/2</span>
                        <span>2π</span>
                    </div>
                </div>
            </div>

            <!-- State overlay -->
            <div class="state-overlay">
                <div class="label">Quantum State</div>
                <div class="value" id="stateDisplay">|ψ⟩ = <span class="highlight">…</span></div>
                <div class="sub" id="stateSub">n = <span id="displayN">3</span> qubits · <span id="displayStates">8</span> basis states</div>
            </div>
        </div>

        <!-- ─── Right Panel ─── -->
        <div class="panel" id="panel">
            <!-- Qubit controls -->
            <div class="panel-section">
                <div class="panel-section-title">Qubits</div>
                <div class="qubit-controls">
                    <button id="qminus">−</button>
                    <span class="qcount" id="qcountDisplay">3</span>
                    <button id="qplus">+</button>
                    <span style="margin-left:8px;font-size:10px;color:#6a7a9a;">active: <span id="activeCountDisplay" style="color:#e8eeff;font-weight:600;">0</span></span>
                </div>
            </div>

            <!-- Presets -->
            <div class="panel-section">
                <div class="panel-section-title">Preset States</div>
                <div class="preset-grid">
                    <button class="preset-btn active" data-state="rainbow">🌈 Rainbow</button>
                    <button class="preset-btn" data-state="ghz">🌀 GHZ</button>
                    <button class="preset-btn" data-state="wstate">🌊 W</button>
                    <button class="preset-btn" data-state="random">🎲 Random</button>
                </div>
            </div>

            <!-- Probabilities -->
            <div class="panel-section" style="flex:1;min-height:0;">
                <div class="panel-section-title">Probabilities (non‑zero)</div>
                <div class="prob-bars" id="probBars"></div>
            </div>

            <!-- State details -->
            <div class="panel-section" style="border-bottom:none;padding-bottom:0;">
                <div class="panel-section-title">State Details</div>
                <div class="info-grid" id="infoGrid">
                    <div class="item"><span class="lbl">Most probable</span><span class="val" id="mostProb">—</span></div>
                    <div class="item"><span class="lbl">Shannon entropy</span><span class="val" id="entropyVal">—</span></div>
                    <div class="item"><span class="lbl">Avg phase</span><span class="val" id="avgPhase">—</span></div>
                    <div class="item"><span class="lbl">Non‑zero</span><span class="val" id="nonzeroCount">—</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─── Three.js ─── -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  IMPORTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const viewport = document.getElementById('viewport');
        const probBars = document.getElementById('probBars');
        const stateDisplay = document.getElementById('stateDisplay');
        const displayN = document.getElementById('displayN');
        const displayStates = document.getElementById('displayStates');
        const mostProb = document.getElementById('mostProb');
        const entropyVal = document.getElementById('entropyVal');
        const avgPhase = document.getElementById('avgPhase');
        const nonzeroCount = document.getElementById('nonzeroCount');
        const qcountDisplay = document.getElementById('qcountDisplay');
        const activeCountDisplay = document.getElementById('activeCountDisplay');
        const qubitInput = document.getElementById('qubitInput');
        const stateCountBadge = document.getElementById('stateCountBadge');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let numQubits = 3;
        let currentAmps = [];
        let currentPreset = 'rainbow';
        let autoRotate = false;
        const PROB_THRESHOLD = 1e-6;

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  THREE.JS SETUP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, viewport.clientWidth / viewport.clientHeight, 0.1, 30);
        camera.position.set(5.2, 4.0, 5.6);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x070a12, 0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        viewport.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(viewport.clientWidth, viewport.clientHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        viewport.appendChild(labelRenderer.domElement);

        // ── controls ──
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 0.8;
        controls.minDistance = 3.0;
        controls.maxDistance = 16;
        controls.target.set(0, 0, 0);
        controls.update();

        // ── lights ──
        const ambient = new THREE.AmbientLight(0x404060, 0.5);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(6, 10, 7);
        scene.add(dirLight);
        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.4);
        fillLight.position.set(-5, -2, -6);
        scene.add(fillLight);
        const rimLight = new THREE.DirectionalLight(0x6c8cff, 0.3);
        rimLight.position.set(-4, 6, -5);
        scene.add(rimLight);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  BUILD SCENE GRAPH
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // ── sphere ──
        const sphereGeo = new THREE.SphereGeometry(2.4 * 0.99, 64, 48);
        const sphereMat = new THREE.MeshPhysicalMaterial({
            color: 0x1a2a5a,
            transparent: true,
            opacity: 0.06,
            roughness: 0.2,
            metalness: 0.0,
            side: THREE.DoubleSide,
            depthWrite: false,
        });
        const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
        mainGroup.add(sphereMesh);

        // ── wireframe ──
        const wireGeo = new THREE.SphereGeometry(2.4 * 0.995, 24, 16);
        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x2a3a6a,
            wireframe: true,
            transparent: true,
            opacity: 0.08,
        });
        const wireMesh = new THREE.Mesh(wireGeo, wireMat);
        mainGroup.add(wireMesh);

        // ── latitude lines ──
        function makeLatLines(radius, segments, steps) {
            const lines = [];
            for (let i = 1; i < steps; i++) {
                const theta = (i / steps) * Math.PI;
                const y = radius * Math.cos(theta);
                const r = radius * Math.sin(theta);
                const pts = [];
                for (let j = 0; j <= segments; j++) {
                    const phi = (j / segments) * 2 * Math.PI;
                    pts.push(new THREE.Vector3(r * Math.cos(phi), y, r * Math.sin(phi)));
                }
                lines.push(pts);
            }
            return lines;
        }

        function makeLonLines(radius, segments, steps) {
            const lines = [];
            for (let i = 0; i < steps; i++) {
                const phi = (i / steps) * 2 * Math.PI;
                const pts = [];
                for (let j = 0; j <= segments; j++) {
                    const theta = (j / segments) * Math.PI;
                    pts.push(new THREE.Vector3(
                        radius * Math.sin(theta) * Math.cos(phi),
                        radius * Math.cos(theta),
                        radius * Math.sin(theta) * Math.sin(phi)
                    ));
                }
                lines.push(pts);
            }
            return lines;
        }

        const gridMat = new THREE.LineBasicMaterial({
            color: 0x2a4a7a,
            transparent: true,
            opacity: 0.15,
            depthWrite: false,
        });

        makeLatLines(2.4, 48, 8).forEach(pts => {
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            mainGroup.add(new THREE.Line(geo, gridMat));
        });
        makeLonLines(2.4, 32, 10).forEach(pts => {
            const geo = new THREE.BufferGeometry().setFromPoints(pts);
            mainGroup.add(new THREE.Line(geo, gridMat));
        });

        // ── equator ──
        const eqPts = [];
        for (let i = 0; i <= 64; i++) {
            const phi = (i / 64) * 2 * Math.PI;
            eqPts.push(new THREE.Vector3(2.4 * Math.cos(phi), 0, 2.4 * Math.sin(phi)));
        }
        const eqGeo = new THREE.BufferGeometry().setFromPoints(eqPts);
        const eqMat = new THREE.LineBasicMaterial({ color: 0x4a7aff, transparent: true, opacity: 0.08 });
        mainGroup.add(new THREE.Line(eqGeo, eqMat));

        // ── axes ──
        function makeAxis(dir, color, label, offset = 0.45) {
            const len = 2.4 + 0.5;
            const direction = dir.clone().normalize();
            const arrow = new THREE.ArrowHelper(direction, new THREE.Vector3(0, 0, 0), len, color, 0.28, 0.14);
            mainGroup.add(arrow);
            const pos = direction.clone().multiplyScalar(len + offset);
            const div = document.createElement('div');
            div.textContent = label;
            div.style.color = '#4a5a7a';
            div.style.fontSize = '11px';
            div.style.fontWeight = '600';
            div.style.fontFamily = 'Segoe UI, sans-serif';
            div.style.textShadow = '0 0 20px rgba(0,0,0,0.9)';
            const lbl = new CSS2DObject(div);
            lbl.position.copy(pos);
            mainGroup.add(lbl);
        }
        makeAxis(new THREE.Vector3(1, 0, 0), 0xff4466, 'X');
        makeAxis(new THREE.Vector3(0, 1, 0), 0x44ff88, 'Y');
        makeAxis(new THREE.Vector3(0, 0, 1), 0x4488ff, 'Z');

        // ── dynamic groups ──
        const statePointGroup = new THREE.Group();
        mainGroup.add(statePointGroup);
        const lineGroup = new THREE.Group(); // radial lines
        mainGroup.add(lineGroup);
        const edgeGroup = new THREE.Group(); // Hamming‑1 edges
        mainGroup.add(edgeGroup);
        const labelGroup = new THREE.Group();
        mainGroup.add(labelGroup);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE POSITIONING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getHammingWeight(i) {
            let w = 0;
            let x = i;
            while (x) { w += x & 1;
                x >>= 1; }
            return w;
        }

        function getStatePosition(i, n) {
            const w = getHammingWeight(i);
            const theta = (w / n) * Math.PI;
            const y = Math.cos(theta) * 2.4;
            const r = Math.sin(theta) * 2.4;

            const byWeight = {};
            for (let j = 0; j < (1 << n); j++) {
                const wj = getHammingWeight(j);
                if (!byWeight[wj]) byWeight[wj] = [];
                byWeight[wj].push(j);
            }
            const group = byWeight[w] || [];
            const idx = group.indexOf(i);
            const count = group.length;
            const phi = count > 1 ? (idx / count) * 2 * Math.PI : 0;

            return new THREE.Vector3(r * Math.cos(phi), y, r * Math.sin(phi));
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  STATE GENERATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function normalize(amps) {
            const norm = Math.sqrt(amps.reduce((s, a) => s + a[0] * a[0] + a[1] * a[1], 0));
            return norm > 1e-12 ? amps.map(a => [a[0] / norm, a[1] / norm]) : amps;
        }

        function generateState(n, preset) {
            const N = 1 << n;
            let amps = [];
            switch (preset) {
                case 'rainbow': {
                    for (let i = 0; i < N; i++) {
                        const phase = (i / N) * 2 * Math.PI;
                        amps.push([Math.cos(phase) / Math.sqrt(N), Math.sin(phase) / Math.sqrt(N)]);
                    }
                    break;
                }
                case 'ghz': {
                    amps = Array.from({ length: N }, () => [0, 0]);
                    amps[0] = [1 / Math.sqrt(2), 0];
                    amps[N - 1] = [1 / Math.sqrt(2), 0];
                    break;
                }
                case 'wstate': {
                    amps = Array.from({ length: N }, () => [0, 0]);
                    const weight1 = [];
                    for (let i = 0; i < N; i++) {
                        if (getHammingWeight(i) === 1) weight1.push(i);
                    }
                    const mag = 1 / Math.sqrt(weight1.length);
                    for (const idx of weight1) {
                        amps[idx] = [mag, 0];
                    }
                    break;
                }
                case 'random': {
                    for (let i = 0; i < N; i++) {
                        const r = 0.2 + Math.random() * 0.8;
                        const phase = Math.random() * 2 * Math.PI;
                        amps.push([r * Math.cos(phase), r * Math.sin(phase)]);
                    }
                    break;
                }
                default: {
                    for (let i = 0; i < N; i++) {
                        amps.push([1 / Math.sqrt(N), 0]);
                    }
                }
            }
            return normalize(amps);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  PHASE → COLOR & FORMATTING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function phaseToColor(phase) {
            const hue = ((phase / (2 * Math.PI)) * 360 + 180) % 360;
            return new THREE.Color(`hsl(${hue}, 80%, 55%)`);
        }

        function formatPhase(phase) {
            let val = ((phase % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
            const pi = Math.PI;
            if (Math.abs(val) < 0.01) return '0';
            if (Math.abs(val - pi) < 0.01) return 'π';
            if (Math.abs(val - pi / 2) < 0.01) return 'π/2';
            if (Math.abs(val - 3 * pi / 2) < 0.01) return '3π/2';
            return (val / pi).toFixed(2) + 'π';
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  UPDATE VISUALIZATION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateQSphere(amps, n) {
            const N = 1 << n;

            // ── clear old ──
            while (statePointGroup.children.length) {
                const c = statePointGroup.children[0];
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
                statePointGroup.remove(c);
            }
            while (lineGroup.children.length) {
                const c = lineGroup.children[0];
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
                lineGroup.remove(c);
            }
            while (edgeGroup.children.length) {
                const c = edgeGroup.children[0];
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
                edgeGroup.remove(c);
            }
            while (labelGroup.children.length) {
                const c = labelGroup.children[0];
                if (c.element && c.element.parentNode) c.element.remove();
                labelGroup.remove(c);
            }

            // ── compute probs and phases ──
            const probs = amps.map(a => a[0] * a[0] + a[1] * a[1]);
            const phases = amps.map(a => Math.atan2(a[1], a[0]));

            // ── find non-zero states ──
            const activeIndices = [];
            for (let i = 0; i < N; i++) {
                if (probs[i] > PROB_THRESHOLD) activeIndices.push(i);
            }

            // ── update active count ──
            activeCountDisplay.textContent = activeIndices.length;

            // ── points, radial lines, and labels for active states ──
            const pointSize = 0.18;
            for (const i of activeIndices) {
                const pos = getStatePosition(i, n);
                const color = phaseToColor(phases[i]);

                // main sphere (fixed size)
                const geo = new THREE.SphereGeometry(pointSize, 20, 18);
                const mat = new THREE.MeshPhysicalMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.25,
                    roughness: 0.2,
                    metalness: 0.05,
                    transparent: true,
                    opacity: 0.95,
                    clearcoat: 0.1,
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(pos);
                statePointGroup.add(mesh);

                // small glow halo
                const gsize = pointSize * 1.8;
                const ggeo = new THREE.SphereGeometry(gsize, 12, 12);
                const gmat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.10,
                    depthWrite: false,
                });
                const glow = new THREE.Mesh(ggeo, gmat);
                glow.position.copy(pos);
                statePointGroup.add(glow);

                // ── radial line from origin ──
                const linePts = [new THREE.Vector3(0, 0, 0), pos.clone()];
                const lgeo = new THREE.BufferGeometry().setFromPoints(linePts);
                const lmat = new THREE.LineBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.45,
                });
                const line = new THREE.Line(lgeo, lmat);
                lineGroup.add(line);

                // ── phase label (CSS2D) ──
                const phaseStr = formatPhase(phases[i]);
                const div = document.createElement('div');
                div.textContent = phaseStr;
                div.style.color = '#e8eeff';
                div.style.fontSize = '10px';
                div.style.fontFamily = 'JetBrains Mono, monospace';
                div.style.background = 'rgba(10,14,28,0.6)';
                div.style.padding = '1px 6px';
                div.style.borderRadius = '3px';
                div.style.border = '1px solid rgba(42,58,90,0.3)';
                div.style.backdropFilter = 'blur(4px)';
                div.style.pointerEvents = 'none';
                div.style.textShadow = '0 0 12px rgba(0,0,0,0.8)';
                const lbl = new CSS2DObject(div);
                // position slightly outward from the point
                const offset = pos.clone().normalize().multiplyScalar(0.38);
                lbl.position.copy(pos.clone().add(offset));
                labelGroup.add(lbl);
            }

            // ── lines: connect active states with Hamming distance 1 ──
            const edgeMat = new THREE.LineBasicMaterial({
                color: 0x5a7aaa,
                transparent: true,
                opacity: 0.20,
                depthWrite: false,
            });

            const activeSet = new Set(activeIndices);
            for (let i = 0; i < N; i++) {
                if (!activeSet.has(i)) continue;
                for (let j = i + 1; j < N; j++) {
                    if (!activeSet.has(j)) continue;
                    const diff = i ^ j;
                    if ((diff & (diff - 1)) === 0 && diff !== 0) {
                        const p1 = getStatePosition(i, n);
                        const p2 = getStatePosition(j, n);
                        const pts = [p1, p2];
                        const geo = new THREE.BufferGeometry().setFromPoints(pts);
                        const line = new THREE.Line(geo, edgeMat.clone());
                        const dist = p1.distanceTo(p2);
                        line.material.opacity = 0.12 + 0.18 * (1 - dist / (2.4 * 1.4));
                        edgeGroup.add(line);
                    }
                }
            }

            // ── update probability bars ──
            updateProbBars(amps, n, activeIndices);

            // ── update info ──
            updateStateInfo(amps, n, activeIndices);

            // ── update state display: show top components with phases ──
            const sorted = activeIndices
                .sort((a, b) => probs[b] - probs[a])
                .slice(0, 3);
            const parts = sorted.map(i => {
                const pct = (probs[i] * 100).toFixed(0);
                const phaseStr = formatPhase(phases[i]);
                return `<span class="phase-highlight">${phaseStr}</span> |${i.toString(2).padStart(n, '0')}⟩ (${pct}%)`;
            });
            stateDisplay.innerHTML = `|ψ⟩ = <span class="highlight">${parts.join(' + ') || '…'}</span>`;

            // ── update counts ──
            displayN.textContent = n;
            displayStates.textContent = N;
            qcountDisplay.textContent = n;
            stateCountBadge.textContent = `${N} states`;
        }

        // ── probability bars ──
        function updateProbBars(amps, n, activeIndices) {
            const probs = amps.map(a => a[0] * a[0] + a[1] * a[1]);
            const phases = amps.map(a => Math.atan2(a[1], a[0]));

            probBars.innerHTML = '';
            const sorted = [...activeIndices].sort((a, b) => probs[b] - probs[a]);

            for (const i of sorted) {
                const prob = probs[i];
                const phase = phases[i];
                const pct = (prob * 100).toFixed(1);
                const color = phaseToColor(phase);

                const row = document.createElement('div');
                row.className = 'prob-row';

                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = `|${i.toString(2).padStart(n, '0')}⟩`;
                row.appendChild(label);

                const track = document.createElement('div');
                track.className = 'track';

                const fill = document.createElement('div');
                fill.className = 'fill';
                fill.style.width = `${Math.max(0.3, prob * 100)}%`;
                fill.style.background = `linear-gradient(90deg, ${color.getStyle()}, ${color.getStyle()}dd)`;
                track.appendChild(fill);
                row.appendChild(track);

                const pval = document.createElement('span');
                pval.className = 'pval';
                pval.textContent = `${pct}%`;
                row.appendChild(pval);

                probBars.appendChild(row);
            }
        }

        // ── state info ──
        function updateStateInfo(amps, n, activeIndices) {
            const N = 1 << n;
            const probs = amps.map(a => a[0] * a[0] + a[1] * a[1]);
            const phases = amps.map(a => Math.atan2(a[1], a[0]));

            let maxIdx = -1,
                maxProb = -1;
            for (const i of activeIndices) {
                if (probs[i] > maxProb) { maxProb = probs[i];
                    maxIdx = i; }
            }
            mostProb.textContent = maxIdx >= 0 ? `|${maxIdx.toString(2).padStart(n, '0')}⟩ (${(maxProb*100).toFixed(1)}%)` : '—';

            let entropy = 0;
            for (const p of probs) {
                if (p > 1e-12) entropy -= p * Math.log2(p);
            }
            entropyVal.textContent = entropy.toFixed(3);

            let sumCos = 0,
                sumSin = 0,
                totalP = 0;
            for (const i of activeIndices) {
                const p = probs[i];
                sumCos += p * Math.cos(phases[i]);
                sumSin += p * Math.sin(phases[i]);
                totalP += p;
            }
            if (totalP > 0) {
                const avg = Math.atan2(sumSin, sumCos);
                avgPhase.textContent = `${((avg / Math.PI * 180 + 360) % 360).toFixed(1)}°`;
            } else {
                avgPhase.textContent = '—';
            }

            nonzeroCount.textContent = `${activeIndices.length} / ${N}`;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  LOAD PRESET
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function loadPreset(name) {
            currentPreset = name;
            const amps = generateState(numQubits, name);
            currentAmps = amps;
            updateQSphere(amps, numQubits);

            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.state === name);
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  SET QUBITS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function setQubits(n) {
            n = Math.max(1, Math.min(6, n));
            numQubits = n;
            qubitInput.value = n;
            loadPreset(currentPreset);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  RESIZE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function resize() {
            const w = viewport.clientWidth;
            const h = viewport.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        }
        window.addEventListener('resize', resize);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  ANIMATION LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function animate() {
            requestAnimationFrame(animate);
            controls.autoRotate = autoRotate;
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  EVENT BINDING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                loadPreset(btn.dataset.state);
            });
        });

        qubitInput.addEventListener('change', () => {
            const val = parseInt(qubitInput.value) || 3;
            setQubits(val);
        });
        qubitInput.addEventListener('input', () => {
            const val = parseInt(qubitInput.value) || 3;
            if (val >= 1 && val <= 6) setQubits(val);
        });

        document.getElementById('qminus').addEventListener('click', () => setQubits(numQubits - 1));
        document.getElementById('qplus').addEventListener('click', () => setQubits(numQubits + 1));

        document.getElementById('rotateToggle').addEventListener('click', () => {
            autoRotate = !autoRotate;
            document.getElementById('rotateToggle').classList.toggle('active', autoRotate);
            controls.autoRotate = autoRotate;
        });

        document.getElementById('resetViewBtn').addEventListener('click', () => {
            camera.position.set(5.2, 4.0, 5.6);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        // keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                autoRotate = !autoRotate;
                document.getElementById('rotateToggle').classList.toggle('active', autoRotate);
                controls.autoRotate = autoRotate;
            }
            if (e.key === 'r' || e.key === 'R') loadPreset('random');
            if (e.key === 'g' || e.key === 'G') loadPreset('ghz');
            if (e.key === 'w' || e.key === 'W') loadPreset('wstate');
            if (e.key === 'b' || e.key === 'B') loadPreset('rainbow');
            if (e.key === 'ArrowUp') setQubits(numQubits + 1);
            if (e.key === 'ArrowDown') setQubits(numQubits - 1);
        });

        renderer.domElement.addEventListener('dblclick', () => {
            autoRotate = !autoRotate;
            document.getElementById('rotateToggle').classList.toggle('active', autoRotate);
            controls.autoRotate = autoRotate;
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        //  INIT
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        setQubits(3);
        animate();

        console.log('✨ Q-Sphere with radial lines and active‑only points ready!');
    </script>
</body>
</html>
