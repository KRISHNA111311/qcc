<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCC – Quantum Learning Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ─── Global Reset & Theme ─── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #0b0e17;
    color: #e7edf4;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── Top Bar ─── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 24px;
    background: #0f1422;
    border-bottom: 1px solid #1e2640;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 8px 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 18px;
    color: #5eead4;
    letter-spacing: 0.3px;
  }
  .brand small {
    font-weight: 400;
    font-size: 13px;
    color: #8a97ab;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar-right .user-info {
    font-size: 13px;
    color: #b0bcdb;
  }
  .topbar-right .user-info strong {
    color: #e7edf4;
  }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #2a3050;
    background: #1a2040;
    color: #e7edf4;
    font-size: 13px;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn:hover {
    background: #222a50;
    border-color: #4a5a8a;
  }
  .btn-primary {
    background: #5eead4;
    border-color: #5eead4;
    color: #062420;
    font-weight: 600;
  }
  .btn-primary:hover {
    background: #7ff0da;
  }
  .btn-danger {
    background: transparent;
    border-color: #f2555a;
    color: #f2555a;
  }
  .btn-danger:hover {
    background: rgba(242,85,90,0.12);
  }

  /* ─── Tabs ─── */
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid #1e2640;
    background: #0f1422;
    padding: 0 24px;
    flex-shrink: 0;
  }
  .tab {
    padding: 10px 20px;
    background: transparent;
    border: none;
    color: #8a97ab;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: 0.15s;
  }
  .tab:hover { color: #e7edf4; }
  .tab.active {
    color: #5eead4;
    border-bottom-color: #5eead4;
  }

  /* ─── Main Content ─── */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ─── Auth Overlay ─── */
  .auth-overlay {
    position: fixed;
    inset: 0;
    background: rgba(4,6,10,0.85);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .auth-box {
    background: #141a24;
    border: 1px solid #2a3050;
    border-radius: 12px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
  }
  .auth-box h2 {
    margin-bottom: 6px;
    font-size: 22px;
    font-weight: 600;
  }
  .auth-box p {
    color: #8a97ab;
    margin-bottom: 20px;
    font-size: 14px;
  }
  .auth-box label {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    color: #b0bcdb;
  }
  .auth-box input {
    width: 100%;
    padding: 8px 12px;
    background: #0f1422;
    border: 1px solid #2a3050;
    border-radius: 6px;
    color: #e7edf4;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .auth-box input:focus {
    outline: none;
    border-color: #5eead4;
  }
  .auth-box .error {
    color: #f2555a;
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 12px;
    display: none;
  }
  .auth-box .switch-link {
    color: #5eead4;
    cursor: pointer;
    font-weight: 500;
  }
  .auth-box .switch-link:hover { text-decoration: underline; }
  .auth-box .actions {
    display: flex;
    gap: 10px;
    margin-top: 4px;
  }

  /* ─── Course List ─── */
  .course-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .course-card {
    background: #141a24;
    border: 1px solid #1e2640;
    border-radius: 8px;
    padding: 16px;
    transition: 0.15s;
    cursor: pointer;
  }
  .course-card:hover {
    border-color: #4a5a8a;
  }
  .course-card h3 {
    font-size: 16px;
    margin-bottom: 4px;
  }
  .course-card p {
    color: #8a97ab;
    font-size: 13px;
  }
  .course-card .badge {
    display: inline-block;
    background: #1e2640;
    color: #b0bcdb;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    margin-top: 8px;
  }

  /* ─── Lesson View ─── */
  .lesson-view {
    max-width: 800px;
  }
  .lesson-view h2 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .lesson-view .meta {
    color: #8a97ab;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .content-block {
    background: #141a24;
    border: 1px solid #1e2640;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .content-block .block-type {
    font-size: 11px;
    text-transform: uppercase;
    color: #4a5a8a;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .content-block .block-text {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.6;
  }
  .content-block .block-video iframe {
    width: 100%;
    aspect-ratio: 16/9;
    border: none;
    border-radius: 6px;
  }
  .complete-btn {
    margin-top: 16px;
  }

  /* ─── Dashboard ─── */
  .dashboard-item {
    background: #141a24;
    border: 1px solid #1e2640;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }
  .dashboard-item .info { flex: 1; }
  .dashboard-item .progress-bar {
    width: 140px;
    height: 8px;
    background: #1e2640;
    border-radius: 4px;
    overflow: hidden;
  }
  .dashboard-item .progress-bar .fill {
    height: 100%;
    background: #5eead4;
    border-radius: 4px;
  }
  .dashboard-item .progress-text {
    font-weight: 600;
    font-size: 15px;
    margin-left: 12px;
  }

  /* ─── Circuit Builder ─── (reused from existing frontend2.html) */
  .circuit-builder {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .gate-palette {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .gate-btn {
    padding: 6px 14px;
    background: #141a24;
    border: 1px solid #2a3050;
    border-radius: 4px;
    color: #e7edf4;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
    transition: 0.1s;
  }
  .gate-btn:hover { background: #1e2640; }
  .gate-btn.active { border-color: #5eead4; background: #1a2240; color: #5eead4; }
  .qubit-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 8px 0;
  }
  .qubit-btn {
    padding: 4px 12px;
    background: #141a24;
    border: 1px solid #2a3050;
    border-radius: 4px;
    color: #b0bcdb;
    cursor: pointer;
  }
  .qubit-btn.selected { background: #5eead4; color: #062420; border-color: #5eead4; }
  .qasm-field {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .qasm-field input {
    flex: 1;
    background: #0f1422;
    border: 1px solid #2a3050;
    border-radius: 6px;
    padding: 8px 12px;
    color: #e7edf4;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    min-width: 200px;
  }
  .results-area {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .results-area img { width: 100%; border-radius: 8px; border: 1px solid #1e2640; background: #fff; }
  .results-area .code-snippet {
    background: #0f1422;
    border: 1px solid #1e2640;
    border-radius: 8px;
    padding: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  @media (max-width: 700px) { .results-area { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<!-- ========== TOP BAR ========== -->
<div class="topbar">
  <div class="brand">
    ⚛ QCC <small>Quantum Learning Platform</small>
  </div>
  <div class="topbar-right" id="topbarRight">
    <span class="user-info" id="userInfo">Loading...</span>
    <button class="btn btn-danger" id="logoutBtn" style="display:none;">Logout</button>
  </div>
</div>

<!-- ========== TABS ========== -->
<div class="tabs" id="tabsContainer">
  <button class="tab active" data-tab="courses">📚 Courses</button>
  <button class="tab" data-tab="dashboard">📊 Dashboard</button>
  <button class="tab" data-tab="composer">🔬 Circuit Composer</button>
</div>

<!-- ========== MAIN CONTENT ========== -->
<div class="main-content" id="mainContent">
  <!-- Rendered by JavaScript -->
</div>

<!-- ========== AUTH OVERLAY ========== -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-box">
    <h2 id="authTitle">Login</h2>
    <p id="authSub">Enter your credentials to access the platform.</p>
    <div id="authError" class="error"></div>
    <label for="authEmail">Email</label>
    <input type="email" id="authEmail" placeholder="user@example.com">
    <label for="authPassword">Password</label>
    <input type="password" id="authPassword" placeholder="••••••••">
    <div id="authExtra" style="display:none;">
      <label for="authFullName">Full Name</label>
      <input type="text" id="authFullName" placeholder="Your name">
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="authSubmit">Login</button>
      <button class="btn" id="authSwitch">Switch to Register</button>
    </div>
  </div>
</div>

<script>
// =====================================================================
// QCC Frontend – Full Application
// =====================================================================

const API_BASE = 'http://localhost:8000/api';

// ─── State ──────────────────────────────────────────────────────────
let currentUser = null;
let accessToken = localStorage.getItem('qcc_token') || null;
let currentTab = 'courses';
let courses = [];
let currentCourse = null;
let currentLesson = null;

// ─── DOM refs ──────────────────────────────────────────────────────
const main = document.getElementById('mainContent');
const authOverlay = document.getElementById('authOverlay');
const authTitle = document.getElementById('authTitle');
const authSub = document.getElementById('authSub');
const authError = document.getElementById('authError');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authFullName = document.getElementById('authFullName');
const authExtra = document.getElementById('authExtra');
const authSubmit = document.getElementById('authSubmit');
const authSwitch = document.getElementById('authSwitch');
const userInfo = document.getElementById('userInfo');
const logoutBtn = document.getElementById('logoutBtn');
const tabsContainer = document.getElementById('tabsContainer');

let isLoginMode = true;

// ─── Utilities ──────────────────────────────────────────────────────
function setAuthHeader(headers = {}) {
  if (accessToken) {
    headers['Authorization'] = 'Bearer ' + accessToken;
  }
  return headers;
}

async function apiFetch(endpoint, options = {}) {
  const url = API_BASE + endpoint;
  const headers = setAuthHeader(options.headers || {});
  headers['Content-Type'] = options.contentType || 'application/json';
  const res = await fetch(url, { ...options, headers });
  if (res.status === 401) {
    // Unauthorized – clear token and show login
    localStorage.removeItem('qcc_token');
    accessToken = null;
    currentUser = null;
    showAuth();
    return null;
  }
  const text = await res.text();
  try { return JSON.parse(text); } catch { return text; }
}

function showAuth() {
  authOverlay.style.display = 'flex';
  main.innerHTML = '';
}

function hideAuth() {
  authOverlay.style.display = 'none';
}

// ─── Authentication ────────────────────────────────────────────────
async function login(email, password) {
  const formData = new URLSearchParams();
  formData.append('username', email);
  formData.append('password', password);
  const res = await fetch(API_BASE + '/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: formData
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err || 'Login failed');
  }
  const data = await res.json();
  accessToken = data.access_token;
  localStorage.setItem('qcc_token', accessToken);
  await loadUser();
  hideAuth();
  renderTab();
}

async function register(email, password, fullName) {
  const res = await fetch(API_BASE + '/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, full_name: fullName })
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err || 'Registration failed');
  }
  // After registration, log in automatically
  await login(email, password);
}

async function loadUser() {
  if (!accessToken) { currentUser = null; return; }
  try {
    const data = await apiFetch('/auth/me');
    if (data) {
      currentUser = data;
      userInfo.innerHTML = `<strong>${currentUser.full_name || currentUser.email}</strong> (${currentUser.role})`;
      logoutBtn.style.display = 'inline-block';
    } else {
      currentUser = null;
      userInfo.textContent = 'Not logged in';
      logoutBtn.style.display = 'none';
    }
  } catch {
    currentUser = null;
    userInfo.textContent = 'Not logged in';
    logoutBtn.style.display = 'none';
  }
}

function logout() {
  localStorage.removeItem('qcc_token');
  accessToken = null;
  currentUser = null;
  userInfo.textContent = 'Not logged in';
  logoutBtn.style.display = 'none';
  showAuth();
}

// ─── Routing / Tabs ────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  renderTab();
}

async function renderTab() {
  if (!currentUser) { showAuth(); return; }
  switch (currentTab) {
    case 'courses': await renderCourses(); break;
    case 'dashboard': await renderDashboard(); break;
    case 'composer': renderComposer(); break;
    default: renderCourses();
  }
}

// ─── Courses Tab ────────────────────────────────────────────────────
async function renderCourses() {
  const data = await apiFetch('/content/courses?published_only=false');
  if (!data) return;
  courses = data;
  let html = '<h2>📚 Available Courses</h2><div class="course-grid">';
  for (const c of courses) {
    const enrolled = currentUser.courses_enrolled && currentUser.courses_enrolled.some(e => e.id === c.id);
    html += `
      <div class="course-card" data-course-id="${c.id}">
        <h3>${c.title}</h3>
        <p>${c.description || ''}</p>
        <div class="badge">${c.is_published ? 'Published' : 'Draft'} · ${c.modules?.length || 0} modules</div>
        <div style="margin-top:8px;">
          ${enrolled ? '<span style="color:#5eead4;">✅ Enrolled</span>' :
            `<button class="btn btn-primary enroll-btn" data-course-id="${c.id}">Enroll</button>`}
          <button class="btn view-course-btn" data-course-id="${c.id}">View</button>
        </div>
      </div>
    `;
  }
  html += '</div>';
  main.innerHTML = html;

  // Event listeners
  document.querySelectorAll('.enroll-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = parseInt(btn.dataset.courseId);
      await apiFetch('/content/enroll', { method: 'POST', body: JSON.stringify({ course_id: id }) });
      await loadUser();
      renderTab();
    });
  });
  document.querySelectorAll('.view-course-btn').forEach(btn => {
    btn.addEventListener('click', () => viewCourse(parseInt(btn.dataset.courseId)));
  });
}

async function viewCourse(courseId) {
  const data = await apiFetch(`/content/courses/${courseId}`);
  if (!data) return;
  currentCourse = data;
  let html = `<button class="btn" onclick="renderCourses()">← Back to courses</button>
              <h2>${data.title}</h2><p>${data.description || ''}</p>`;
  for (const mod of data.modules || []) {
    html += `<h3 style="margin-top:16px;">${mod.title}</h3>`;
    for (const lesson of mod.lessons || []) {
      const completed = currentUser.progress && currentUser.progress.some(p => p.lesson_id === lesson.id && p.completed);
      html += `
        <div style="background:#141a24;border:1px solid #1e2640;border-radius:6px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
          <span>${lesson.title} ${completed ? '✅' : ''}</span>
          <button class="btn view-lesson-btn" data-lesson-id="${lesson.id}">View</button>
        </div>
      `;
    }
  }
  main.innerHTML = html;
  document.querySelectorAll('.view-lesson-btn').forEach(btn => {
    btn.addEventListener('click', () => viewLesson(parseInt(btn.dataset.lessonId)));
  });
}

async function viewLesson(lessonId) {
  // Find lesson in currentCourse
  let lesson = null;
  for (const mod of currentCourse.modules || []) {
    const found = mod.lessons.find(l => l.id === lessonId);
    if (found) { lesson = found; break; }
  }
  if (!lesson) { alert('Lesson not found'); return; }
  currentLesson = lesson;
  let html = `<button class="btn" onclick="viewCourse(${currentCourse.id})">← Back to course</button>
              <div class="lesson-view">
                <h2>${lesson.title}</h2>
                <div class="meta">${lesson.description || ''}</div>`;
  for (const block of lesson.content_blocks || []) {
    html += `<div class="content-block">`;
    html += `<div class="block-type">${block.content_type}</div>`;
    if (block.content_type === 'text') {
      html += `<div class="block-text">${block.data.text || ''}</div>`;
    } else if (block.content_type === 'video') {
      html += `<div class="block-video"><iframe src="${block.data.url || ''}" allowfullscreen></iframe></div>`;
    } else if (block.content_type === 'circuit') {
      html += `<div><pre style="background:#0f1422;padding:10px;border-radius:6px;">${block.data.qasm_d || ''}</pre></div>`;
    } else {
      html += `<pre>${JSON.stringify(block.data, null, 2)}</pre>`;
    }
    html += `</div>`;
  }
  // Check if completed
  const completed = currentUser.progress && currentUser.progress.some(p => p.lesson_id === lesson.id && p.completed);
  html += `
    <div class="complete-btn">
      ${completed ? '✅ Completed' : `<button class="btn btn-primary" id="completeLessonBtn">Mark as Complete</button>`}
    </div>
  `;
  html += '</div>';
  main.innerHTML = html;
  document.getElementById('completeLessonBtn')?.addEventListener('click', async () => {
    await apiFetch(`/progress/lesson/${lesson.id}/complete`, { method: 'POST' });
    await loadUser();
    viewLesson(lesson.id); // refresh
  });
}

// ─── Dashboard Tab ──────────────────────────────────────────────────
async function renderDashboard() {
  const data = await apiFetch('/progress/dashboard');
  if (!data) return;
  let html = '<h2>📊 Your Progress</h2>';
  if (!data.length) html += '<p>You are not enrolled in any courses yet.</p>';
  for (const item of data) {
    html += `
      <div class="dashboard-item">
        <div class="info">
          <strong>${item.course_title}</strong>
          <div style="font-size:13px;color:#8a97ab;">${item.completed_lessons}/${item.total_lessons} lessons</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="progress-bar"><div class="fill" style="width:${item.progress_percentage}%;"></div></div>
          <span class="progress-text">${item.progress_percentage}%</span>
        </div>
      </div>
    `;
  }
  main.innerHTML = html;
}

// ─── Circuit Composer Tab ──────────────────────────────────────────
function renderComposer() {
  // This reuses the circuit builder from the original frontend2.html
  // but we need to inject it; we'll build a minimal but functional version.
  // For simplicity, we'll keep the same gate palette, qubit selection,
  // QASM-D field, run button, and results.
  // We'll copy the logic from the previous frontend2.html but adapt API calls.
  // However, to avoid duplication, we'll embed the full builder code here.
  // Since this is a large chunk, we'll use a template literal.

  const builderHtml = `
    <div class="circuit-builder">
      <h2>🔬 Quantum Circuit Composer</h2>
      <div class="gate-palette">
        ${['H','X','Y','Z','S','T','SX','RX','RY','RZ','CX','CZ','SWAP','CCX','I','MEASURE'].map(g => `
          <button class="gate-btn" data-gate="${g}">${g}</button>
        `).join('')}
      </div>
      <div>
        <strong>Qubits:</strong>
        <div class="qubit-row" id="qubitRow">
          ${Array.from({length:5}, (_,i) => `<button class="qubit-btn" data-qubit="${i}">q${i}</button>`).join('')}
        </div>
        <button class="btn" id="addQubit">+ Add qubit</button>
        <button class="btn" id="removeQubit">- Remove qubit</button>
      </div>
      <div class="qasm-field">
        <input id="qasmInput" placeholder="QASM-D string will appear here" readonly>
        <button class="btn btn-primary" id="runCircuitBtn">▶ Run</button>
        <button class="btn" id="clearCircuitBtn">Clear</button>
      </div>
      <div id="resultsArea" class="results-area"></div>
    </div>
  `;
  main.innerHTML = builderHtml;

  // --- Circuit builder logic (reused) ---
  let selectedGate = null;
  let selectedQubits = [];
  let qubitCount = 5;
  let qasmString = '';

  const gateMap = {
    'H': { arity:1, code:'1' },
    'X': { arity:1, code:'3' },
    'Y': { arity:1, code:'4' },
    'Z': { arity:1, code:'5' },
    'S': { arity:1, code:'J' },
    'T': { arity:1, code:'L' },
    'SX': { arity:1, code:'N' },
    'RX': { arity:1, code:'8', param:true },
    'RY': { arity:1, code:'9', param:true },
    'RZ': { arity:1, code:'D', param:true },
    'CX': { arity:2, code:'2' },
    'CZ': { arity:2, code:'F' },
    'SWAP': { arity:2, code:'7' },
    'CCX': { arity:3, code:'G' },
    'I': { arity:1, code:'I' },
    'MEASURE': { arity:1, code:'A' },
  };

  function updateQubitButtons() {
    const row = document.getElementById('qubitRow');
    row.innerHTML = Array.from({length:qubitCount}, (_,i) =>
      `<button class="qubit-btn" data-qubit="${i}">q${i}</button>`
    ).join('');
    // Re-bind qubit clicks
    document.querySelectorAll('.qubit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const q = parseInt(btn.dataset.qubit);
        if (!selectedGate) return;
        const info = gateMap[selectedGate];
        if (!info) return;
        if (selectedQubits.includes(q)) return;
        selectedQubits.push(q);
        document.querySelectorAll('.qubit-btn').forEach(b => {
          b.classList.toggle('selected', selectedQubits.includes(parseInt(b.dataset.qubit)));
        });
        if (selectedQubits.length === info.arity) {
          // Build token
          const code = info.code;
          let token = '';
          if (info.param) {
            const angle = parseFloat(prompt('Enter angle (radians):', '1.5708')) || 0;
            const angleInt = Math.round(angle * 100);
            const angleStr = String(angleInt).padStart(4, '0');
            const qstr = (selectedQubits[0] + 1).toString();
            token = code + qstr + angleStr;
          } else {
            const qstr = selectedQubits.map(q => (q+1).toString()).join('');
            token = code + qstr;
          }
          if (qasmString === '') {
            qasmString = qubitCount.toString() + '#' + token;
          } else {
            qasmString += '#' + token;
          }
          document.getElementById('qasmInput').value = qasmString;
          selectedQubits = [];
          document.querySelectorAll('.qubit-btn').forEach(b => b.classList.remove('selected'));
          document.querySelectorAll('.gate-btn').forEach(b => b.classList.remove('active'));
          selectedGate = null;
        }
      });
    });
  }

  // Gate selection
  document.querySelectorAll('.gate-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.gate-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedGate = btn.dataset.gate;
      selectedQubits = [];
      document.querySelectorAll('.qubit-btn').forEach(b => b.classList.remove('selected'));
    });
  });

  // Qubit controls
  document.getElementById('addQubit').addEventListener('click', () => {
    qubitCount++;
    updateQubitButtons();
  });
  document.getElementById('removeQubit').addEventListener('click', () => {
    if (qubitCount > 1) qubitCount--;
    updateQubitButtons();
  });

  // Clear
  document.getElementById('clearCircuitBtn').addEventListener('click', () => {
    qasmString = '';
    document.getElementById('qasmInput').value = '';
    document.getElementById('resultsArea').innerHTML = '';
    selectedGate = null;
    selectedQubits = [];
    document.querySelectorAll('.gate-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.qubit-btn').forEach(b => b.classList.remove('selected'));
  });

  // Run
  document.getElementById('runCircuitBtn').addEventListener('click', async () => {
    const qasm = document.getElementById('qasmInput').value.trim();
    if (!qasm) { alert('Circuit is empty.'); return; }
    // Ensure it ends with 00 if not
    let fullQasm = qasm;
    if (!fullQasm.endsWith('00')) fullQasm += '00';
    const response = await fetch(API_BASE + '/execute', {
      method: 'POST',
      headers: setAuthHeader({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ qasm_d: fullQasm, shots: 1024 })
    });
    const data = await response.json();
    if (data.success) {
      const d = data.data;
      let html = '';
      if (d.visualizations.histogram) html += `<img src="data:image/png;base64,${d.visualizations.histogram}" alt="Histogram">`;
      if (d.visualizations.bloch) html += `<img src="data:image/png;base64,${d.visualizations.bloch}" alt="Bloch">`;
      if (d.visualizations.qsphere) html += `<img src="data:image/png;base64,${d.visualizations.qsphere}" alt="Q-sphere">`;
      html += `<div class="code-snippet">${JSON.stringify(d.results.counts, null, 2)}</div>`;
      document.getElementById('resultsArea').innerHTML = html;
    } else {
      alert('Error: ' + (data.error || 'Unknown error'));
    }
  });

  // Initialise qubit buttons
  updateQubitButtons();
}

// ─── Tab switching ──────────────────────────────────────────────────
tabsContainer.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) switchTab(tab.dataset.tab);
});

// ─── Auth overlay logic ────────────────────────────────────────────
authSwitch.addEventListener('click', () => {
  isLoginMode = !isLoginMode;
  if (isLoginMode) {
    authTitle.textContent = 'Login';
    authSub.textContent = 'Enter your credentials to access the platform.';
    authSubmit.textContent = 'Login';
    authSwitch.textContent = 'Switch to Register';
    authExtra.style.display = 'none';
  } else {
    authTitle.textContent = 'Register';
    authSub.textContent = 'Create a new account to get started.';
    authSubmit.textContent = 'Register';
    authSwitch.textContent = 'Switch to Login';
    authExtra.style.display = 'block';
  }
  authError.style.display = 'none';
});

authSubmit.addEventListener('click', async () => {
  const email = authEmail.value.trim();
  const password = authPassword.value.trim();
  if (!email || !password) { authError.textContent = 'Email and password are required.'; authError.style.display = 'block'; return; }
  authError.style.display = 'none';
  try {
    if (isLoginMode) {
      await login(email, password);
    } else {
      const fullName = authFullName.value.trim() || email;
      await register(email, password, fullName);
    }
  } catch (err) {
    authError.textContent = err.message || 'Authentication failed.';
    authError.style.display = 'block';
  }
});

// ─── Logout ─────────────────────────────────────────────────────────
logoutBtn.addEventListener('click', logout);

// ─── Initialisation ────────────────────────────────────────────────
(async function init() {
  await loadUser();
  if (currentUser) {
    hideAuth();
    renderTab();
  } else {
    showAuth();
  }
})();

</script>
</body>
</html>
